<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genshin Impact Resin Timer</title>
    <meta name="description" content="Genshin Impact Original Resin timer, calculator, and tracker.">

    <link rel="icon" type="image/png" href="./img/favicon.png"/>
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <header class="hero">
        <h1>Genshin Impact</h1>
        <h2>Resin Timer</h2>
    </header>

    <main class="container">
        <div class="input-row">
            <label class="input-label" id="resin-input-label" for="resin">Current Resin (0 - 200)</label>
            <input type="number" class="form-control" id="resin" min="0" max="200">
            <button id="resin-button">Calculate</button>
        </div>

        <section class="stat">
            <div class="title-top">Current Resin</div>
            <div class="title-bottom" id="current-resin"></div>
        </section>

        <section class="stat">
            <div class="title-top">Full Refill in</div>
            <div class="title-bottom" id="refill-time"></div>
        </section>

        <section class="stat">
            <div class="title-top">at</div>
            <div class="title-bottom" id="refill-date"></div>
        </section>
    </main>

    <footer>
        <p>This website is not affiliated with miHoYo. | 2020 - 2026 | <a href="https://github.com/JacobDev1/genshin_timer" target="_blank" rel="noreferrer noopener">GitHub</a></p>
    </footer>
    <script src="./js/main.js"></script>
</body>
</html>
